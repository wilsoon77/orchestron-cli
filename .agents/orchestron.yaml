# ==============================================================================
# ORCHESTRON DECLARATIVE WORKSPACE SPECIFICATION (Inspired by Google AX)
# apiVersion: orchestron.ai/v1alpha1
# ==============================================================================

apiVersion: orchestron.ai/v1alpha1
kind: Workspace
metadata:
  name: cli-orquestador-agent
  version: "1.0.0"
  createdAt: "2026-10-21"

spec:
  # 1. Stack & Pre-wired Environment
  stack:
    type: generic
    backend: "Node.js CLI Tool (TypeScript)"
    commands:
      build: "npm run build"
      test: "npm test"
      lint: "npm run lint"

  # 2. Tool Bindings & External MCP Providers
  tools:
    mcpServers:
      - name: context7
        access: enabled
    skills:
      - archify
      - graphify
      - packet-tracer-automation
      - agy-customizations
      - antigravity_guide
      - automation
      - generative_ui
      - migrate-workflows
      - permissioned-github
      - plugin
      - ui-plugin-navigation

  # 3. Security Gateway: Tool Permissions per Role (Google AX Gateway Pattern)
  gateway:
    policies:
      - role: lead-architect
        allowedTools:
          - view_file
          - grep_search
          - find_by_name
          - read_url_content
          - search_web
        forbiddenActions:
          - modify_source_code_before_gate1
          - destructive_shell_commands

      - role: backend-dev
        allowedTools:
          - view_file
          - replace_file_content
          - write_to_file
          - grep_search
          - find_by_name
          - run_command
        forbiddenActions:
          - modify_frontend_views_directly
          - commit_secrets

      - role: qa-tester
        allowedTools:
          - view_file
          - grep_search
          - find_by_name
          - run_command
        forbiddenActions:
          - modify_business_logic_to_force_test_pass

      - role: code-reviewer
        allowedTools:
          - view_file
          - grep_search
          - find_by_name
          - run_command
        forbiddenActions:
          - modify_source_code
          - approve_suppressed_errors

      - role: git-security
        allowedTools:
          - view_file
          - replace_file_content
          - write_to_file
          - grep_search
          - find_by_name
          - run_command
        forbiddenActions:
          - git_push_force
          - version_env_files

  # 4. Declarative Subagent Swarm Configuration (Teamwork / Parallel Spawns)
  subagents:
    - id: lead-architect
      name: "Lead Architect & Planner"
      promptFile: ".agents/agents/lead-architect.md"
      workspaceMode: "inherit"
      canForkParallelTeam: true

    - id: backend-dev
      name: "Backend Specialist"
      promptFile: ".agents/agents/backend-dev.md"
      workspaceMode: "branch"

    - id: qa-tester
      name: "QA & Verification Specialist"
      promptFile: ".agents/agents/qa-tester.md"
      workspaceMode: "inherit"

    - id: code-reviewer
      name: "Code Reviewer & Quality Auditor"
      promptFile: ".agents/agents/code-reviewer.md"
      workspaceMode: "inherit"

    - id: git-security
      name: "Git & Security Auditor"
      promptFile: ".agents/agents/git-security.md"
      workspaceMode: "inherit"

  # 5. Quality Gates & Acceptance Criteria
  qualityGates:
    gate1_userApproval: strict
    gate2_zeroCompilationErrors: strict
    gate3_gitAndContextAudit: strict
